<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1332" viewBox="0 0 900 1332" role="img" aria-label="Terminal. Desarrollo agentes de IA y los despliego en AWS. IA: LLM agents, RAG, MCP servers. Lenguajes: Python, TypeScript. Frameworks: LangGraph, FastAPI, React, Next.js. Nube: AWS, Amazon Bedrock, Terraform, Docker. Calidad: evals con RAGAS, tracing con Langfuse y LangSmith. Me gusta Linux. Actividad en GitHub del último año en un gráfico 3D: {{CONTRIB}} contribuciones, {{COMMITS}} commits, {{PRS}} pull requests y {{STREAK}} días de racha.">
<style>
/*FONTS*/
text{white-space:pre}
.typing{transform:translateX(182px);animation:type .9s steps(23) .5s both}
.r{animation:in .25s ease-out both}
.cur{animation:blink 1s steps(1) 2.4s infinite}
@keyframes type{from{transform:translateX(0)}to{transform:translateX(182px)}}
@keyframes in{from{opacity:0}to{opacity:1}}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.typing{animation:none;transform:translateX(182px)}.r{animation:none}.cur{animation:none}}
</style>
<defs>
<clipPath id="win"><rect width="900" height="1332" rx="12"/></clipPath>
<linearGradient id="tabA" x1="0" x2="1"><stop offset="0" stop-color="#0b0b0b"/><stop offset=".14" stop-color="#F5AEC1"/><stop offset=".86" stop-color="#F5AEC1"/><stop offset="1" stop-color="#0b0b0b"/></linearGradient>
<linearGradient id="tabB" x1="0" x2="1"><stop offset="0" stop-color="#0b0b0b"/><stop offset=".16" stop-color="#1E1B29"/><stop offset=".84" stop-color="#1E1B29"/><stop offset="1" stop-color="#0b0b0b"/></linearGradient>
<linearGradient id="tabC" x1="0" x2="1"><stop offset="0" stop-color="#0b0b0b"/><stop offset=".16" stop-color="#17202A"/><stop offset=".84" stop-color="#17202A"/><stop offset="1" stop-color="#0b0b0b"/></linearGradient>
</defs>
<g clip-path="url(#win)">
<rect width="900" height="1332" fill="#0b0b0b"/>

<!-- titlebar -->
<line x1="0" y1="38.5" x2="900" y2="38.5" stroke="#1c1c1c"/>
<text x="450" y="24" text-anchor="middle" font-family="MS600, sans-serif" font-size="13" fill="#dddddd">alejandro@campo: ~</text>
<g fill="#262626"><circle cx="814" cy="19" r="11"/><circle cx="844" cy="19" r="11"/><circle cx="874" cy="19" r="11"/></g>
<g stroke="#dddddd" stroke-width="1.4" fill="none"><path d="M809 19h10"/><rect x="840" y="15" width="8" height="8" stroke-width="1.2"/><path d="M870 15l8 8M878 15l-8 8"/></g>

<!-- split 1 (focused) -->
<rect x="4.5" y="42.5" width="891" height="787" fill="none" stroke="#F5AEC1"/>
<text x="22" y="72" font-family="JM400, monospace" font-size="13" fill="#dddddd"><tspan fill="#9CCBF2">~/perfil</tspan> <tspan fill="#8a8a8a">on</tspan> <tspan fill="#C3B1F5">main</tspan> <tspan fill="#F5AEC1">❯</tspan> <tspan fill="#A6E3C8">kitten</tspan> icat <tspan text-decoration="underline">retrato.png</tspan></text>
<rect class="typing" x="170" y="58" width="184" height="20" fill="#0b0b0b"/>
<image class="r" style="animation-delay:1.5s" x="22" y="84" width="856" height="478" preserveAspectRatio="xMidYMid slice" href="{{PORTRAIT}}"/>
<g class="r" style="animation-delay:1.8s"><text x="22" y="588" font-family="JM400, monospace" font-size="13" fill="#dddddd"><tspan fill="#9CCBF2">~/perfil</tspan> <tspan fill="#8a8a8a">on</tspan> <tspan fill="#C3B1F5">main</tspan> <tspan fill="#F5AEC1">❯</tspan> <tspan fill="#A6E3C8">whoami</tspan></text></g>
<g class="r" style="animation-delay:2s"><text x="22" y="624" font-family="JM500, monospace" font-size="20" fill="#ffffff">Desarrollo agentes de IA y los despliego en AWS.</text></g>
<g class="r" style="animation-delay:2.2s" font-family="JM400, monospace" font-size="13" fill="#dddddd">
<text x="22" y="658"><tspan fill="#F5AEC1">ia</tspan><tspan x="130">LLM agents, RAG, MCP servers</tspan></text>
<text x="22" y="678"><tspan fill="#C3B1F5">lenguajes</tspan><tspan x="130">Python, TypeScript</tspan></text>
<text x="22" y="698"><tspan fill="#9CCBF2">frameworks</tspan><tspan x="130">LangGraph, FastAPI, React, Next.js</tspan></text>
<text x="22" y="718"><tspan fill="#A6E3C8">nube</tspan><tspan x="130">AWS, Amazon Bedrock, Terraform, Docker</tspan></text>
<text x="22" y="738"><tspan fill="#F3DC97">calidad</tspan><tspan x="130">evals con RAGAS, tracing con Langfuse y LangSmith</tspan></text>
<text x="22" y="758"><tspan fill="#dddddd">me gusta</tspan><tspan x="130">Linux</tspan></text>
</g>
<g class="r" style="animation-delay:2.3s"><rect x="22" y="774" width="28" height="14" fill="#F5AEC1"/><rect x="50" y="774" width="28" height="14" fill="#C3B1F5"/><rect x="78" y="774" width="28" height="14" fill="#9CCBF2"/><rect x="106" y="774" width="28" height="14" fill="#A6E3C8"/><rect x="134" y="774" width="28" height="14" fill="#F3DC97"/><rect x="162" y="774" width="28" height="14" fill="#dddddd"/></g>
<g class="r" style="animation-delay:2.4s"><text x="22" y="814" font-family="JM400, monospace" font-size="13" fill="#dddddd"><tspan fill="#9CCBF2">~/perfil</tspan> <tspan fill="#8a8a8a">on</tspan> <tspan fill="#C3B1F5">main</tspan> <tspan fill="#F5AEC1">❯</tspan></text><rect class="cur" x="171" y="801" width="8" height="17" fill="#cccccc"/></g>

<!-- split 2: GitHub activity as an isometric 3D chart -->
<rect x="4.5" y="834.5" width="891" height="465" fill="none" stroke="#333333"/>
<text x="22" y="864" font-family="JM400, monospace" font-size="13" fill="#dddddd"><tspan fill="#9CCBF2">~/perfil</tspan> <tspan fill="#8a8a8a">on</tspan> <tspan fill="#C3B1F5">main</tspan> <tspan fill="#F5AEC1">❯</tspan> <tspan fill="#A6E3C8">gh</tspan> contrib <tspan fill="#C3B1F5">--3d</tspan></text>
<g transform="translate(-20.6 730.4) scale(1.4)">{{ISOMETRIC}}</g>
<text x="870" y="922" text-anchor="end" font-family="JM700, monospace" font-weight="700" font-size="30" fill="#ffffff">{{CONTRIB}}</text>
<text x="870" y="946" text-anchor="end" font-family="JM400, monospace" font-size="13" fill="#8a8a8a">contribuciones en el último año</text>
<g font-family="JM400, monospace" font-size="12" fill="#dddddd">
<text x="22" y="1244"><tspan font-family="JM700, monospace" font-weight="700" fill="#C3B1F5">{{COMMITS}}</tspan> commits</text>
<text x="22" y="1262"><tspan font-family="JM700, monospace" font-weight="700" fill="#9CCBF2">{{PRS}}</tspan> pull requests</text>
<text x="22" y="1280"><tspan font-family="JM700, monospace" font-weight="700" fill="#F3DC97">{{STREAK}}</tspan> días de racha</text>
</g>

