<text x="56" y="1320" text-anchor="middle" font-family="JM700i, monospace" font-weight="700" font-style="italic" font-size="12" fill="#000000">1 perfil</text>
<rect x="110" y="1304" width="92" height="24" fill="url(#tabB)"/>
<text x="156" y="1320" text-anchor="middle" font-family="JM400, monospace" font-size="12" fill="#C3B1F5">2 nvim</text>
<rect x="204" y="1304" width="84" height="24" fill="url(#tabC)"/>
<text x="246" y="1320" text-anchor="middle" font-family="JM400, monospace" font-size="12" fill="#9CCBF2">3 aws</text>
</g>
