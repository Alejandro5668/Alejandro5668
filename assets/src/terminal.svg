<text x="478" y="1072" text-anchor="end" font-family="JM700, monospace" font-weight="700" fill="#F3DC97">{{STREAK}}</text><text x="492" y="1072">días, racha más larga</text>
<text x="478" y="1092" text-anchor="end" font-family="JM700, monospace" font-weight="700" fill="#dddddd">{{BEST}}</text><text x="492" y="1092">contribuciones, mejor día</text>
