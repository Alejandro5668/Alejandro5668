<text x="22" y="718"><tspan fill="#A6E3C8">backend</tspan><tspan x="130">Python, Node.js</tspan></text>
<text x="22" y="738"><tspan fill="#F3DC97">frontend</tspan><tspan x="130">Next.js</tspan></text>
<text x="22" y="758"><tspan fill="#dddddd">entorno</tspan><tspan x="130">Linux, kitty y la terminal</tspan></text>
</g>
