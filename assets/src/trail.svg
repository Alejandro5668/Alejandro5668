<svg xmlns="http://www.w3.org/2000/svg" width="880" height="1180" viewBox="0 0 880 1180" role="img" aria-label="Siempre hacia adelante: no me quedo quieto. Voy a donde nadie quiere ir: los retos que todos esquivan son los que más me llaman. Tecnología y emprendimiento son mis dos mundos. Construir con IA, a fondo: quiero entenderla por dentro. Hacia dónde voy: fundar mi propia empresa de tecnología, crear productos con IA que cambien cómo trabaja la gente y pase lo que pase, nunca te pares.">
