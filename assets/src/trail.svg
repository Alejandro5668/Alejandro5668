<g font-family="BG800, sans-serif" font-size="32" letter-spacing="-1" fill="#F6F1FF">
<text x="128" y="100">Siempre hacia adelante</text>
<text x="128" y="270">Voy a donde nadie quiere ir</text>
<text x="128" y="440">Tecnología y emprendimiento</text>
<text x="128" y="610">Construir con IA, a fondo</text>
</g>

<g font-family="NR300, Georgia, serif" font-size="21" fill="#DCD6F5">
<text x="128" y="142">No me quedo quieto. Si algo no sale hoy, mañana lo intento de otra</text>
<text x="128" y="172">forma. Me mueve la idea de ser un poco mejor que ayer.</text>
<text x="128" y="312">Los retos que todos esquivan son los que más me llaman. Ahí es</text>
<text x="128" y="342">donde más aprendo y donde más disfruto.</text>
<text x="128" y="482">Son mis dos mundos. No solo escribo código: pienso en qué problema</text>
<text x="128" y="512">resuelve, para quién es y cómo puede crecer.</text>
<text x="128" y="652">No me basta con usarla: quiero entenderla por dentro. Construyo</text>
<text x="128" y="682">agentes y sistemas RAG, y estudio IA y Ciencia de Datos para</text>
<text x="128" y="712">llegar más hondo.</text>
</g>

<rect x="120" y="772" width="704" height="262" rx="20" fill="#F6F1FF"/>
<text x="156" y="836" font-family="BG800, sans-serif" font-size="38" letter-spacing="-1.2" fill="#1B1F4B">Hacia dónde voy</text>
<path transform="translate(158 880)" d="M1 13l6-10 4 6 2-3 4 7z" fill="#E0A82E"/>
<path transform="translate(158 926)" d="M1 13l6-10 4 6 2-3 4 7z" fill="#FF7A6B"/>
<path transform="translate(158 972)" d="M1 13l6-10 4 6 2-3 4 7z" fill="#1F9E85"/>
<g font-family="NR400, Georgia, serif" font-size="22" fill="#1B1F4B">
<text x="190" y="893">Fundar mi propia empresa de tecnología.</text>
<text x="190" y="939">Crear productos con IA que cambien cómo trabaja la gente.</text>
<text x="190" y="985">Pase lo que pase, nunca te pares.</text>
</g>

<g font-family="NR300, Georgia, serif" font-size="19" fill="#C9C3E6">
<text x="56" y="1096">Hoy soy Solutions Engineer en KAWAK y estudio en la UNAD. En la mochila llevo</text>
<text x="56" y="1126"><tspan font-family="BG600, sans-serif" fill="#F6F1FF">Python</tspan>, <tspan font-family="BG600, sans-serif" fill="#F6F1FF">FastAPI</tspan>, <tspan font-family="BG600, sans-serif" fill="#F6F1FF">React</tspan>, <tspan font-family="BG600, sans-serif" fill="#F6F1FF">Next.js</tspan>, <tspan font-family="BG600, sans-serif" fill="#F6F1FF">AWS</tspan>, <tspan font-family="BG600, sans-serif" fill="#F6F1FF">LangGraph</tspan> y <tspan font-family="BG600, sans-serif" fill="#F6F1FF">Bedrock</tspan>.</text>
</g>
